[package]
name = "avro-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Avro tojson and fromjson commands powered by Apache Avro"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
apache-avro = { version = "0.22", features = ["snappy", "bzip", "xz", "zstandard"] }
clap = { version = "4", features = ["derive"] }
miniz_oxide = "0.9"
getrandom = "0.4"
zstd = "0.13"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
